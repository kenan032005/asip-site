e Moussoro le 1er août 2026. La cérémonie s'est déroulée en présence du maire, des délégués provinciaux de l'action sociale, des infrastructures et de la société civile.\nDans le cadre de la mise en œuvre des activités sur le changement climatique et les données migratoires (CCND), la commune de Moussoro a reçu un soutien significatif. Le maire de Moussoro a officiellement réceptionné les équipements, composés de 12 500 sacs de 100 kg, 50 paires de bottes, 100 pelles, 25 pioches, 250 bâches et 25 brouettes.\nLors de la cérémonie, le chef de bureau de l’OIM, Moustapha Ahmat Moustapha, a souligné que cet appui permettrait à la commune de mieux gérer les inondations. Il a assuré le comité provincial de lutte contre les inondations de leur soutien continu dans la mise en œuvre des activités.\nLe maire de Moussoro, Issa Abdraman Tchoungouli, a déclaré que ces équipements arrivaient à point nommé, car la mairie fait déjà face aux inondations dès les premières pluies. Ces kits permettront d'aménager les rues pour faciliter la circulation des citoyens. Il a exprimé sa gratitude envers l’OIM et le ministère des Affaires étrangères du Danemark pour leur soutien technique et financier.\nIl est important de noter que l’OIM a formé pendant trois jours le Comité Provincial de Gestion de Catastrophes sur le thème du renforcement des capacités en gestion des risques et des catastrophes dans la province du Barh El Gazel. Ce projet, financé par le ministère des Affaires étrangères du Danemark, sera poursuivi dans le Barh El Gazel Nord dans les jours à venir.", "body_status": "full_body", "article_word_count": 325, "extraction_method": "generic_density", "extraction_quality_score": 85, "extraction_quality_reasons": [], "canonical_url": "https://www.alwihdainfo.com/tchad-appui-de-loim-a-la-commune-de-moussoro-pour-lutter-contre-les-inondations/", "discovery_method": "rss", "fetch_http_status": 200, "pipeline_version": 2, "schema_version": "2.0", "run_id": "20260802T014500+0800_005110"} 'organisation indique que la première attaque est survenue dans la nuit du 29 au 30 juin 2026 dans la commune de Gouro. Cinq personnes, dont un adulte et quatre enfants, ont été mordues par des chacals. En raison de l'absence de sérum et de vaccins antirabiques dans les structures sanitaires de la province, les victimes ont dû être évacuées vers Abéché et N'Djamena pour recevoir les soins appropriés.\nPour Dr Djiddi Ali Sougoudi, médecin infectiologue, assistant d'université et praticien au CHU-Renaissance, toute morsure de carnassier constitue une urgence médicale. « Il faut rapidement prendre en charge une plaie de morsure afin d'éviter une hémorragie ou une atteinte d'un organe vital, surtout chez le jeune enfant », explique-t-il. Il recommande également de laver immédiatement la plaie avec de l'eau et du savon pendant au moins quinze minutes afin de réduire le risque de transmission du virus de la rage.\nSelon le communiqué, une nouvelle attaque est survenue dans la nuit du 27 au 28 juillet 2026, toujours dans la commune de Gouro, faisant plus de dix nouveaux cas de morsures. Cette recrudescence confirme, selon l'ONG, la gravité de la menace qui pèse sur les populations locales.\nL'infectiologue met en garde contre les conséquences d'une prise en charge tardive. Il rappelle qu'une plaie de morsure ne doit pas être suturée immédiatement, car cela peut emprisonner le virus dans les tissus et favoriser sa progression vers le cerveau, où il provoque une encéphalite presque toujours mortelle. Après l'évaluation de la blessure, notamment lorsqu'elle est classée au stade 3, il est indispensable d'administrer un sérum antirabique (immunoglobuline) afin de neutraliser le virus, puis de débuter sans délai la vaccination antirabique.\nDr Djiddi Ali Sougoudi insiste sur le fait que le sérum et le vaccin sont deux traitements complémentaires qui ne doivent pas être confondus. Il rappelle que plusieurs protocoles vaccinaux existent, notamment Zagreb, Essen, l'Institut Pasteur de Thaïlande et celui de l'Institut Pasteur du Cambodge, validé par l'Organisation mondiale de la Santé (OMS), qu'il privilégie en raison de son coût réduit et de sa simplicité d'application.\nLe spécialiste déplore toutefois les difficultés d'accès aux traitements. Selon lui, obtenir le sérum antirabique et le vaccin relève souvent d'un véritable parcours du combattant. Les familles sont parfois contraintes d'acheter le vaccin Verorab dans des pharmacies privées, tandis que le sérum Vinrab reste difficilement disponible. Il regrette l'inaction du ministère de la Santé publique face à cette urgence thérapeutique et préventive.\nFace à cette situation, l'ONG « Nimè Tombà » appelle le ministère de la Santé publique à approvisionner sans délai les structures sanitaires de l'Ennedi Ouest en sérum et en vaccins antirabiques afin d'assurer une prise en charge rapide des victimes. L'infectiologue estime également que le ministère de l'Élevage doit intervenir rapidement en organisant la vaccination des animaux domestiques, notamment les chiens et les chats, mais aussi en mettant en place des mesures de contrôle des carnivores sauvages tels que les chacals, les hyènes, les renards, les fennecs, les mangoustes, les caracals et les ratels. Les animaux présentant un comportement anormal devraient, selon lui, être capturés ou euthanasiés.\n« Tous ces chacals qui attaquent l'homme sont d'emblée suspects de rage », affirme-t-il. Pour le médecin, le fait que ces animaux s'approchent des habitations et mordent des humains constitue un changement de comportement inhabituel pouvant être lié à cette maladie.\nInterrogé sur les mesures de prévention, Dr Djiddi Ali Sougoudi recommande aux populations d'éviter tout contact avec un carnassier qui ne fuit pas à l'approche de l'homme. « Un chacal en bonne santé craint naturellement l'homme. Lorsqu'il ne cherche plus à s'enfuir, c'est un comportement anormal qui doit alerter », souligne-t-il.\nIl appelle également les propriétaires à faire vacciner leurs chiens et leurs chats afin d'empêcher la transmission de la rage aux animaux domestiques. Toute personne mordue, griffée ou léchée par un carnassier, domestique ou sauvage, doit consulter immédiatement un centre de santé, même si la blessure paraît bénigne. Il rappelle enfin qu'un lavage soigneux de la plaie au savon pendant quinze minutes constitue un geste essentiel avant toute prise en charge médicale.\nLe médecin plaide également pour un renforcement durable du système de santé, avec une disponibilité permanente des sérums et vaccins antirabiques grâce à une chaîne du froid efficace, ainsi qu'une meilleure formation du personnel soignant sur la prévention et la prise en charge de la rage.\nDe son côté, l'ONG demande au ministère de l'Environnement, en collaboration avec le ministère de l'Élevage, d'identifier et de neutraliser les animaux infectés, tout en renforçant la surveillance et la vaccination des canidés domestiques et sauvages.\nEnfin, elle invite les habitants de la région à redoubler de vigilance, particulièrement pendant la nuit, à sécuriser leurs habitations et à prendre toutes les précautions nécessaires afin de prévenir de nouvelles attaques.", "body_status": "full_body", "article_word_count": 850, "extraction_method": "jsonld_article_body", "extraction_quality_score": 85, "extraction_quality_reasons": [], "canonical_url": "https://lendjampost.com/ennedi-ouest-la-multiplication-des-attaques-de-chacals-fait-craindre-un-risque-de-rage-un-infectiologue-appelle-a-une-prise-en-charge-urgente/", "discovery_method": "rss", "fetch_http_status": 200, "pipeline_version": 2, "schema_version": "2.0", "run_id": "20260802T014500+0800_005110"}, {"event_id": "EVT_5291228872082f78", "country": "乍得", "country_cn": "乍得", "country_risk_level": 4, "country_risk_label": "极高", "event_type": "other_security", "event_severity": "medium", "event_status": "new", "title_cn": "", "title_original": "Tchad: attaques de chacals qui pourraient être infectés par la r ": 4, "country_risk_label": "极高", "event_type": "natural_disaster", "event_severity": "medium", "event_status": "new", "title_cn": "", "title_original": "Tchad : appui de l'OIM à la commune de Moussoro pour lutter contre les inondations", "summary_cn": "", "summary_original": "L'OIM a fourni à Moussoro des équipements pour lutter contre les inondations, renforçant ainsi la gestion des risques climatiques dans la région.", "event_time": "2026-08-01T18:02:40.000Z", "published_time": "2026-08-01T18:02:40.000Z", "location": "", "china_related": false, "verification_level": "single_source", "verification_label_cn": "单一来源", "independent_source_count": 1, "source_links": [{"url": "https://www.alwihdainfo.com/tchad-appui-de-loim-a-la-commune-de-moussoro-pour-lutter-contre-les-inondations/", "source_name": "Alwihda Info", "source_group": "chad", "language": "fr"}], "potential_impact": "", "progress": "", "current_policy_passed": true, "quality_gate_passed": true, "legacy_migration_preserved": false, "legacy_visibility": true, "publication_reason": "单一来源，待自动/人工核实", "body_extracted": "Tchad\nTchad : appui de l'OIM à la commune de Moussoro pour lutter contre les inondations\nL'OIM a fourni à Moussoro des équipements pour lutter contre les inondations, renforçant ainsi la gestion des risques climatiques dans la région.\nAlwihda Info\n01 août 2026\nAdoum Mbaidoua\nPar Adoum Mbaidoua\nL’Organisation Internationale pour les Migrations (OIM) a fourni des équipements de lutte contre les inondations à la mairie de Moussoro le 1er août 2026. La cérémonie s'est déroulée en présence du maire, des délégués provinciaux de l'action sociale, des infrastructures et de la société civile.\nDans le cadre de la mise en œuvre des activités sur le changement climatique et les données migratoires (CCND), la commune de Moussoro a reçu un soutien significatif. Le maire de Moussoro a officiellement réceptionné les équipements, composés de 12 500 sacs de 100 kg, 50 paires de bottes, 100 pelles, 25 pioches, 250 bâches et 25 brouettes.\nLors de la cérémonie, le chef de bureau de l’OIM, Moustapha Ahmat Moustapha, a souligné que cet appui permettrait à la commune de mieux gérer les inondations. Il a assuré le comité provincial de lutte contre les inondations de leur soutien continu dans la mise en œuvre des activités.\nLe maire de Moussoro, Issa Abdraman Tchoungouli, a déclaré que ces équipements arrivaient à point nommé, car la mairie fait déjà face aux inondations dès les premières pluies. Ces kits permettront d'aménager les rues pour faciliter la circulation des citoyens. Il a exprimé sa gratitude envers l’OIM et le ministère des Affaires étrangères du Danemark pour leur soutien technique et financier.\nIl est important de noter que l’OIM a formé pendant trois jours le Comité Provincial de Gestion de Catastrophes sur le thème du renforcement des capacités en gestion des risques et des catastrophes dans la province du Barh El Gazel. Ce projet, financé par le ministère des Affaires étrangères du Danemark, sera poursuivi dans le Barh El Gazel Nord dans les jours à venir.", "body_status": "full_body", "article_word_count": 325, "extraction_method": "generic_density", "extraction_quality_score": 85, "extraction_quality_reasons": [], "canonical_url": "https://www.alwihdainfo.com/tchad-appui-de-loim-a-la-commune-de-moussoro-pour-lutter-contre-les-inondations/", "discovery_method": "rss", "fetch_http_status": 200, "pipeline_version": 2, "schema_version": "2.0", "run_id": "20260802T014500+0800_005110"}, {"event_id": "EVT_68ba0eb89452a250", "country": "乍得", "country_cn": "乍得", "country_risk_level": 4, "country_risk_label": "极高", "event_type": "other_security", "event_severity": "medium", "event_status": "new", "title_cn": "", "title_original": "Ennedi Ouest : la multiplication des attaques de chacals fait craindre un risque de rage, un infectiologue appelle à une prise", "summary_cn": "", "summary_original": "La province de l’Ennedi Ouest, dans le nord du Tchad, est confront t praticien au CHU-Renaissance, toute morsure de carnassier constitue une urgence médicale. « Il faut rapidement prendre en charge une plaie de morsure afin d'éviter une hémorragie ou une atteinte d'un organe vital, surtout chez le jeune enfant », explique-t-il. Il recommande également de laver immédiatement la plaie avec de l'eau et du savon pendant au moins quinze minutes afin de réduire le risque de transmission du virus de la rage.\nSelon le communiqué, une nouvelle attaque est survenue dans la nuit du 27 au 28 juillet 2026, toujours dans la commune de Gouro, faisant plus de dix nouveaux cas de morsures. Cette recrudescence confirme, selon l'ONG, la gravité de la menace qui pèse sur les populations locales.\nL'infectiologue met en garde contre les conséquences d'une prise en charge tardive. Il rappelle qu'une plaie de morsure ne doit pas être suturée immédiatement, car cela peut emprisonner le virus dans les tissus et favoriser sa progression vers le cerveau, où il provoque une encéphalite presque toujours mortelle. Après l'évaluation de la blessure, notamment lorsqu'elle est classée au stade 3, il est indispensable d'administrer un sérum antirabique (immunoglobuline) afin de neutraliser le virus, puis de débuter sans délai la vaccination antirabique.\nDr Djiddi Ali Sougoudi insiste sur le fait que le sérum et le vaccin sont deux traitements complémentaires qui ne doivent pas être confondus. Il rappelle que plusieurs protocoles vaccinaux existent, notamment Zagreb, Essen, l'Institut Pasteur de Thaïlande et celui de l'Institut Pasteur du Cambodge, validé par l'Organisation mondiale de la Santé (OMS), qu'il privilégie en raison de son coût réduit et de sa simplicité d'application.\nLe spécialiste déplore toutefois les difficultés d'accès aux traitements. Selon lui, obtenir le sérum antirabique et le vaccin relève souvent d'un véritable parcours du combattant. Les familles sont parfois contraintes d'acheter le vaccin Verorab dans des pharmacies privées, tandis que vent_severity": "medium", "event_status": "new", "title_cn": "", "title_original": "Tchad : appui de l'OIM à la commune de Moussoro pour lutter contre les inondations", "summary_cn": "", "summary_original": "L'OIM a fourni à Moussoro des équipements pour lutter contre les inondations, renforçant ainsi la gestion des risques climatiques dans la région.", "event_time": "2026-08-01T18:02:40.000Z", "published_time": "2026-08-01T18:02:40.000Z", "location": "", "china_related": false, "verification_level": "single_source", "verification_label_cn": "单一来源", "independent_source_count": 1, "source_links": [{"url": "https://www.alwihdainfo.com/tchad-appui-de-loim-a-la-commune-de-moussoro-pour-lutter-contre-les-inondations/", "source_name": "Alwihda Info", "source_group": "chad", "language": "fr"}], "potential_impact": "", "progress": "", "current_policy_passed": true, "quality_gate_passed": true, "legacy_migration_preserved": false, "legacy_visibility": true, "publication_reason": "单一来源，待自动/人工核实", "body_extracted": "Tchad\nTchad : appui de l'OIM à la commune de Moussoro pour lutter contre les inondations\nL'OIM a fourni à Moussoro des équipements pour lutter contre les inondations, renforçant ainsi la gestion des risques climatiques dans la région.\nAlwihda Info\n01 août 2026\nAdoum Mbaidoua\nPar Adoum Mbaidoua\nL’Organisation Internationale pour les Migrations (OIM) a fourni des équipements de lutte contre les inondations à la mairie de Moussoro le 1er août 2026. La cérémonie s'est déroulée en présence du maire, des délégués provinciaux de l'action sociale, des infrastructures et de la société civile.\nDans le cadre de la mise en œuvre des activités sur le changement climatique et les données migratoires (CCND), la commune de Moussoro a reçu un soutien significatif. Le maire de Moussoro a officiellement réceptionné les équipements, composés de 12 500 sacs de 100 kg, 50 paires de bottes, 100 pelles, 25 pioches, 250 bâches et 25 brouettes.\nLors de la cérémonie, le chef de bureau de l’OIM, Moustapha Ahmat Moustapha, a souligné que cet appui permettrait à la commune de mieux gérer les inondations. Il a assuré le comité provincial de lutte contre les inondations de leur soutien continu dans la mise en œuvre des activités.\nLe maire de Moussoro, Issa Abdraman Tchoungouli, a déclaré que ces équipements arrivaient à point nommé, car la mairie fait déjà face aux inondations dès les premières pluies. Ces kits permettront d'aménager les rues pour faciliter la circulation des citoyens. Il a exprimé sa gratitude envers l’OIM et le ministère des Affaires étrangères du Danemark pour leur soutien technique et financier.\nIl est important de noter que l’OIM a formé pendant trois jours le Comité Provincial de Gestion de Catastrophes sur le thème du renforcement des capacités en gestion des risques et des catastrophes dans la province du Barh El Gazel. Ce projet, financé par le ministère des Affaires étrangères du Danemark, sera poursuivi dans le Barh El Gazel Nord dans les jours à venir.", "body_status": "full_body", "article_word_count": 325, "extraction_method": "generic_density", "extraction_quality_score": 85, "extraction_quality_reasons": [], "canonical_url": "https://www.alwihdainfo.com/tchad-appui-de-loim-a-la-commune-de-moussoro-pour-lutter-contre-les-inondations/", "discovery_method": "rss", "fetch_http_status": 200, "pipeline_version": 2, "schema_version": "2.0", "run_id": "20260802T014500+0800_005110"}, {"event_id": "EVT_68ba0eb89452a250", "country": "TD", "country_cn": "乍得", "country_risk_level": 4, "country_risk_label": "极高", "event_type": "other_security", "event_severity": "medium", "event_status": "new", "title_cn": "", "title_original": "Ennedi Ouest : la multiplication des attaques de chacals fait craindre un risque de rage, un infectiologue appelle à une prise", "summary_cn": "", "summary_original": "La province de l’Ennedi Ouest, dans le nord du Tchad, est confrontée à une série d’attaques de chacals ayant fait plus de quinze victimes en l’espace d’un mois. Face à cette situation jugée préoccupante, l’ONG « Nimè Tombà » appelle les autorités à agir rapidement afin d’éviter de nouveaux drames. Dans un communiqué rendu public […]\n\n L’article  Ennedi Ouest : la multiplication des attaques de chacals fait craindre un risque de rage, un infectiologue appelle à une prise en charge urgente  est ap", "event_time": "2026-08-01T16:04:24+02:00", "published_time": "2026-08-01T16:04:24+02:00", "location": "", "china_related": false, "verification_level": "single_source", "verification_label_cn": "单一来源", "independent_source_count": 1, "source_links": [{"url": "https://lendjampost.com/ennedi-ouest-la-multiplication-des-attaques-de-chacals-fait-craindre-un-risque-de-rage-un-infectiologue-appelle-a-une-prise-en-charge-urgente/", "source_name": "Le N'Djam Post", "source_group": "chad", "language": "fr"}], "potential_impact": "", "progress": "", "current_policy_passed": true, "quality_gate_passed": true, "legacy_migration_preserved": false, "legacy_visibility": true, "publication_reason": "单一来源，待自动/人工核实", "body_extracted": "La province de l'Ennedi Ouest, dans le nord du Tchad, est confrontée à une série d'attaques de chacals ayant fait plus de quinze victimes en l'espace d'un mois. Face à cette situation jugée préoccupante, l'ONG « Nimè Tombà » appelle les autorités à agir rapidement afin d'éviter de nouveaux drames.\nDans un communiqué rendu public le 30 juillet 2026, l'organisation indique que la première attaque est survenue dans la nuit du 29 au 30 juin 2026 dans la commune de Gouro. Cinq personnes, dont un adulte et quatre enfants, ont été mordues par des chacals. En raison de l'absence de sérum et de vaccins antirabiques dans les structures sanitaires de la province, les victimes ont dû être évacuées vers Abéché et N'Djamena pour recevoir les soins appropriés.\nPour Dr Djiddi Ali Sougoudi, médecin infectiologue, assistant d'université et praticien au CHU-Renaissance, toute morsure de carnassier constitue que chose, mais on n’a pas eu l'occasion de faire des analyses médicales pour confirmer . »\nPlusieurs défis à relever\nPas d'analyses car les structures manquent sur place, comme les sérums et vaccins contre la rage que l'ONG a dû faire venir de Ndjamena, à plus de 1 000 km, avec l'aide du Dr Djiddi Ali Sougoudi. Le médecin infectiologue note qu'une attaque d’hyène a aussi eu lieu dans le centre du pays cette année.\nPour lui, il y a plusieurs défis à relever :  « Le défi de la distance, le défi de la chaîne de froid, le défi de la disponibilité du vaccin et le défi de la formation du personnel. Et puis, d’autre part, il y a les animaux. Il faut d'abord que [le ministère de] l'Élevage s'en prenne aux animaux mordeurs qui sont enragés pour les tuer ou les euthanasier et vacciner les autres. D'une part les animaux sauvages qu’il faut vacciner et d'autre part les chiens domestiques et les chats qu’il faut aussi vacciner, mais il faut également un système de contrôle.  »\nCommuniqué de l'ONG Nimé Tombà        © Nimé Tombà", "body_status": "full_body", "article_word_count": 406, "extraction_method": "generic_density", "extraction_quality_score": 85, "extraction_quality_reasons": [], "canonical_url": "https://www.rfi.fr/fr/afrique/20260801-tchad-attaques-de-chacals-qui-pourraient-%C3%AAtre-infect%C3%A9s-par-la-rage-dans-la-commune-de-gouro", "discovery_method": "rss", "fetch_http_status": 200, "pipeline_version": 2, "schema_version": "2.0", "run_id": "20260802T014500+0800_005110"}, {"event_id": "EVT_8c9d4096815dd33c", "country": "TD", "country_cn": "乍得", "country_risk_level": 4, "country_risk_label": "极高", "event_type": "other_security", "event_severity": "medium", "event_status": "new", "title_cn": "", "title_original": "Tchad : le ministre des Armées effectue une mission de sécurité à Owi - Journal du Tchad", "summary_cn": "", "summary_original": "© (DR) \n\n Le ministre en charge des rmées, Issaka Malloua Djamouss, effectue à Owi, dans la province du Tibesti, une miss (ANP) – Au lendemain de l’inhumation des éléments des Forces de défense et de sécurité (FDS) tombés sur le champ d’honneur lors d’une attaque terroriste perpétrée dans le département de N’Guigmi, le Gouverneur de la région de Diffa, le Général de Division Mahamadou Ibrahim Bagadoma, a rencontré, ce samedi 1er août 2026, les différents corps des FDS en poste à N’Guigmi afin de leur transmettre le message de compassion, de solidarité et d’encouragement des plus hautes autorités du Niger.\nAprès avoir passé la nuit dans le chef-lieu du département, le Gouverneur, accompagné des responsables régionaux des Forces de défense et de sécurité, du Préfet du département de N’Guigmi et de l’Administrateur délégué de la commune urbaine, s’est rendu dès les premières heures de la matinée à la 53ᵉ Bataillon Interarmes (BIA) de N’Guigmi.\nLa rencontre a débuté par la montée des couleurs nationales, suivie d’un rapport des différentes unités militaires et de sécurité.\nPrenant la parole devant les officiers, sous-officiers et hommes de rang, le Gouverneur a tenu à exprimer le soutien indéfectible des autorités nationales aux soldats engagés sur le théâtre des opérations.\n« Nous sommes ici présents avec vous pour vous accompagner dans la douleur que vous traversez. Nous sommes porteurs d’un message de compassion, de condoléances mais également d’encouragement des plus hautes autorités de notre pays », a déclaré le Général de Division Mahamadou Ibrahim Bagadoma.\nIl a indiqué que «ce message émane notamment du Président de la République, Chef de l’État et Chef suprême des Armées, le Général d’Armée Abdourahamane Tiani, du Premier ministre, M. Ali Lamine Zeine, du Ministre d’État, Ministre de la Défense nationale, le Général d’Armée Salifou Mody, ainsi que du Ministre de l’Intérieur, le Général de Division Mohamed Toumba».\nLe Gouverneur a assuré les éléments des FDS que, malgré la distance, ces autorités suivent avec une attention particulière l’évolution de la situation sécuritaire dans le département de N’Guigmi et saluent leur courage ainsi que leur engagement au service de la Nation».\nÉvoquant les récents événements, il a exhorté les forces engagées à ne pas céder au découragement.\n« Nous avons traversé des moments très difficiles, mais ces événements ne doivent jamais atteindre notre moral, encore moins affecter notre détermination à poursuivre le combat. Ils doivent plutôt renforcer notre conviction que nous menons une guerre juste : celle de la défense de notre pays, de nos familles, de nos populations et de nos richesses », a-t-il souligné.\nLe Gouverneur a rappelé que le sacrifice consenti par les militaires tombés au champ d’honneur impose à tous leurs compagnons d’armes de poursuivre la lutte jusqu’à la victoire.\n« Nous ne devons jamais oublier nos martyrs. Ils ne sont pas tombés pour rien. Ils se sont battus avec bravoure, professionnalisme et amour de la Patrie. Nous leur devons de poursuivre ce combat jusqu’à la victoire finale, avec l’aide de Dieu », a-t-il déclaré.\nLe Général Mahamadou Ibrahim Bagadoma a également invité les différentes composantes des Forces de défense et de sécurité à demeurer vigilantes face à un ennemi qui adapte continuellement ses modes opératoires.\n« L’ennemi est toujours présent. Il multiplie les ruses et change ses modes d’action. À nous de nous adapter. Nous avons les capacités, les compétences et l’intelligence nécessaires pour déjouer ses plans », a-t-il insisté.\nIl a enfin invité l’assistance à observer des prières pour le repos des âmes des militaires disparus, implorant Dieu de les accueillir dans Son paradis éternel et d’accorder consolation, paix et sérénité à leurs familles.\nÀ l’issue de cette rencontre avec les Forces de défense et de sécurité, le Gouverneur et la délégation se sont rendus successivement au palais du Chef de canton de N’Guigmi puis à celui du Chef du groupement Boudouma de Rimi.\nAu cours de ces visites, le Gouverneur a transmis aux autorités coutumières la reconnaissance des plus hautes autorités de l’État pour leur engagement constant aux côtés des pouvoirs publics, notamment dans les domaines de la préservation de la paix, du renforcement de la cohésion sociale et de la promotion du vivre-ensemble.\nIl a particulièrement salué les multiples initiatives de prières collectives et les actions de sensibilisation menées par les chefs traditionnels en faveur de la stabilité de la région.\nLe Général de Division Mahamadou Ibrahim Bagadoma les a exhortés à poursuivre ces efforts en renforçant davantage la sensibilisation des populations afin qu’elles collaborent étroitement avec les Forces de défense et de sécurité dans leur mission de protection de l’intégrité territoriale et de lutte contre le terrorisme.\nIl faut noter que cette visite de terrain du Gouverneur de la région de Diffa s’inscrit dans la dynamique de proximité avec les Forces de défense et de sécurité ainsi que les autorités administratives et coutumières, dans un contexte marqué par la poursuite des opérations de sécurisation de cette partie orientale du Niger confrontée aux menaces des groupes armés terroristes.\nAOM/SML/ANP/août 2026", "body_status": "full_body", "article_word_count": 809, "extraction_method": "generic_density", "extraction_quality_score": 85, "extraction_quality_reasons": [], "canonical_url": "https://anp.ne/diffa-le-gouverneur-apporte-le-soutien-des-plus-hautes-autorites-aux-forces-de-defense-et-de-securite-a-nguigmi-et-appelle-a-poursuivre-le-combat-contre-le-terrorisme/", "discovery_method": "rss", "fetch_http_status": 200, "pipeline_version": 2, "schema_version": "2.0", "run_id": "20260802T014500+0800_005110"}, {"event_id": "EVT_9a551301360773c7", "country": "TD", "country_cn": "乍得", "country_risk_level": 4, "country_risk_label": "极高", "event_type": "strike", "event_severity": "medium", "event_status": "new", "title_cn": "", "title_original": "Tchad | Grève des enseignants : le régime ampute les salaires et franchit un seuil inquiétant", "summary
