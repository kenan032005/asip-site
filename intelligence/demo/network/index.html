<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>动态关系图 · ASIP安全情报知识库</title><link rel="stylesheet" href="../../../assets/css/style.css"><link rel="stylesheet" href="../../../assets/css/intelligence.css"></head>
<body data-intel-page="network">
<div id="topbar"></div><main class="intel-shell network-page"><div id="intelError" class="intel-error" hidden></div>
  <div class="intel-breadcrumb"><a href="../">微型样板</a><span>/</span><span>动态中心关系图</span></div>
  <section class="intel-network-head"><div><span class="intel-overline">RELATIONSHIP GRAPH · ONE-HOP EXPLORER</span><h1>动态中心关系图</h1><p>点击任一节点，它会平滑移动到中央；图谱只展示新中心的一度关系。</p></div><div class="network-focus"><span>当前焦点</span><b id="focusName">JNIM</b><code id="focusId">actor-jnim</code></div></section>
  <section class="network-toolbar"><label class="network-search"><span>搜索实体</span><input id="entitySearch" type="search" placeholder="输入中文名、英文名或ID"></label><button id="backFocus" class="intel-button ghost sm">← 上一焦点</button><button id="resetFocus" class="intel-button ghost sm">重置 JNIM</button><div class="network-zoom"><button id="zoomOut" class="intel-button ghost sm">−</button><span id="zoomValue">100%</span><button id="zoomIn" class="intel-button ghost sm">＋</button><button id="fitGraph" class="intel-button ghost sm">适配</button></div></section>
  <section class="network-layout"><div class="graph-panel"><div id="graphWrap" class="graph-wrap"><svg id="graphSvg" viewBox="0 0 900 620" role="img" aria-label="实体关系图"><g id="graphViewport"></g></svg><div id="graphHint" class="graph-hint">加载共享实体与关系数据…</div></div><div class="graph-legend"><span><i class="shape circle"></i>组织</span><span><i class="shape diamond"></i>人物</span><span><i class="shape square"></i>国家</span><span><i class="line solid"></i>当前/一般关系</span><span><i class="line dashed"></i>历史/争议关系</span></div></div><aside class="network-info"><div id="nodeInfo" class="intel-panel"></div><div id="relationInfo" class="intel-panel relation-info"><h2>关系详情</h2><p class="muted">点击关系线查看双方、类型、时间与来源。</p></div><div class="intel-panel"><h2>显示筛选</h2><div class="filter-list"><label><input type="checkbox" data-type-filter="organization" checked> 组织</label><label><input type="checkbox" data-type-filter="person" checked> 人物</label><label><input type="checkbox" data-type-filter="country" checked> 国家</label></div><div class="filter-list relation-filter"><label><input type="checkbox" data-rel-filter="affiliated_with" checked> 关联/效忠</label><label><input type="checkbox" data-rel-filter="constituent_of" checked> 组成</label><label><input type="checkbox" data-rel-filter="operates_in" checked> 活动/存在</label><label><input type="checkbox" data-rel-filter="hostile_to" checked> 敌对</label><label><input type="checkbox" data-rel-filter="other" checked> 其他关系</label></div></div></aside></section>
</main><footer class="site"></footer><script src="../../../assets/js/intelligence/intelligence.js"></script><script src="../../../assets/js/intelligence/network.js"></script></body></html>
