name: Deploy ASIP to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 北京时间 22:00 = UTC 14:00（GitHub Actions 使用 UTC）
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate data (JSON 解析 + 必需字段)
        run: |
          python - <<'PY'
          import json, sys, os
          ok = True
          required = {
            "data/risk-levels.json": ["tiers","levels"],
            "data/countries.json": ["countries"],
            "data/events.json": ["events"],
            "data/status.json": ["monitored_country_count"],
            "data/sources.json": ["tiers","local_by_country"],
          }
          for f, keys in required.items():
              if not os.path.exists(f):
                  print("缺失文件:", f); ok = False; continue
              try:
                  d = json.load(open(f, encoding="utf-8"))
              except Exception as e:
                  print("JSON 解析失败:", f, e); ok = False; continue
              for k in keys:
                  if k not in d:
                      print("缺字段", k, "in", f); ok = False
          c = json.load(open("data/countries.json", encoding="utf-8"))
          if len(c["countries"]) != 22:
              print("国家数量应为 22，实际", len(c["countries"])); ok = False
          print("数据校验通过" if ok else "数据校验未通过")
          sys.exit(0 if ok else 1)
          PY

      - name: Generate daily reports (北京时间 22:00 触发时生效)
        run: python scripts/generate_reports.py

      - name: Build static site
        run: python scripts/build_site.py

      - name: Link/structure check
        run: |
          python - <<'PY'
          import os
          for f in ["index.html","events.html","countries.html","country.html","reports.html","report.html","disease-risk.html","404.html"]:
              if not os.path.exists(os.path.join("dist", f)):
                  raise SystemExit("dist 缺少页面: " + f)
          for d in ["assets","data"]:
              if not os.path.isdir(os.path.join("dist", d)):
                  raise SystemExit("dist 缺少目录: " + d)
          print("结构与链接检查通过")
          PY

      - name: Deploy to gh-pages branch
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
          cd ..

      - name: Failure notification
        if: failure()
        run: |
          echo "::error::部署失败。gh-pages 上一次成功内容仍对外提供，不会用空白覆盖历史数据。"
          echo "请检查上方步骤日志（数据校验 / 构建 / 部署）。"
