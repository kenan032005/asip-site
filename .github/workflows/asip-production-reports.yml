name: ASIP Production Reports

# Stage 8C Package3 — Production Reports（§八/§九/§十七/§二十六）
# Stage8D fix：schedule 已迁移到 ASIP Production Orchestrator（每日 20:00 BJT 由
# orchestrator 依据 production-state 判定 due 并以 --source canonical 真实生成）。
# 本 workflow 仅保留 workflow_dispatch 供显式 manual/shadow 使用：
#   source=production → canonical；source=shadow（默认）→ derived；run_ai 开关。
# 报告状态：FULL / FALLBACK / LOW_DATA（Fact Gate PASS 为前提）；Fact Gate FAIL → HOLD。

on:
  workflow_dispatch:
    inputs:
      source:
        description: "报告输入源（shadow=derived 冻结数据 / production=canonical）"
        required: false
        type: choice
        default: shadow
        options:
          - shadow
          - production
      run_ai:
        description: "真实 AI Analysis（默认 false = FALLBACK/LOW_DATA）"
        required: false
        type: boolean
        default: false

concurrency:
  group: asip-prod-reports
  cancel-in-progress: false

permissions:
  contents: write

env:
  ASIP_MODE: development
  browser_direct_api_call: "false"
  ASIP_DEEPSEEK_API_KEY: ${{ secrets.ASIP_DEEPSEEK_API_KEY }}

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          ref: 3ece942e2e34887cbb2879d360cd3edc2622b0c6
          fetch-depth: 1

      - name: Checkout production state branch
        uses: actions/checkout@v4
        with:
          ref: production-state
          path: state_src
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Load state（cold start）
        run: |
          mkdir -p data/runtime/ops
          cp -r state_src/data/runtime/ops/* data/runtime/ops/ 2>/dev/null || true

      - name: Africa Daily（§八，北京 20:00；dispatch 默认 shadow）
        if: github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SOURCE: ${{ github.event.inputs.source }}
          RUN_AI: ${{ github.event.inputs.run_ai }}
        run: |
          SRC="derived"; AI_FLAG="--no-ai"
          [ "$SOURCE" = "production" ] && SRC="canonical"
          [ "$RUN_AI" = "true" ] && AI_FLAG=""
          python scripts/ops/reports_run.py --mode daily --source $SRC $AI_FLAG

      - name: Country Weekly（§九，北京 周日 06:45；dispatch 默认 shadow）
        if: github.event.schedule == '45 22 * * 6' || github.event_name == 'workflow_dispatch'
        env:
          SOURCE: ${{ github.event.inputs.source }}
          RUN_AI: ${{ github.event.inputs.run_ai }}
        run: |
          SRC="derived"; AI_FLAG="--no-ai"
          [ "$SOURCE" = "production" ] && SRC="canonical"
          [ "$RUN_AI" = "true" ] && AI_FLAG=""
          python scripts/ops/reports_run.py --mode tcd_weekly --source $SRC $AI_FLAG
          python scripts/ops/reports_run.py --mode ssd_weekly --source $SRC $AI_FLAG

      - name: Commit state → production-state branch
        run: |
          cp -r data/runtime/ops/* state_src/data/runtime/ops/ 2>/dev/null || true
          cd state_src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/runtime/ops
          git commit -m "ops: reports run ${{ github.run_id }}" --allow-empty || echo "no state change"
          git push origin production-state
          cd ..

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-reports
          path: data/runtime/ops/reports/
          if-no-files-found: warn

      - name: Trigger auto deploy（§十八：state 合法变化 → build → validate → deploy）
        if: vars.AUTO_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kenan032005/asip-site/actions/workflows/asip-production-deploy.yml/dispatches \
            -d '{"ref":"main","inputs":{"shadow_only":"false"}}' \
            -o /dev/null -w "AUTO_DEPLOY_TRIGGER_HTTP=%{http_code}\n"
