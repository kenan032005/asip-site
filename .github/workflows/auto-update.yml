# ASIP 自动采集与发布（GitHub Actions 备用通道）
#
# 触发计划（cron 为 UTC；北京时间 = UTC+8）：
#   - 每 2 小时第 0 分：增量采集（近 6 小时窗口）→ 三级池处理 → 构建 → 部署
#   - 每日 13:30 UTC（北京 21:30）：日报前补充采集（近 24 小时窗口）
#   - 每日 14:00 UTC（北京 22:00）：全量核实 + 生成乍得/尼日尔日报 → 构建 → 部署
#   - workflow_dispatch：手动触发（可选传入采集窗口小时数）
#
# 启用条件：需要一枚具备 workflow 权限的 GitHub PAT（classic 勾选 repo + workflow）
# 将本文件推送到 main 分支，并在仓库 Settings -> Actions 允许运行。
#
# 合规说明：部署使用仓库自带 GITHUB_TOKEN，任何密钥不写入代码或提交记录。
# 采集只通过公开合法接口（RSS / GDELT ArtList / ReliefWeb API），不抓取付费全文。
name: ASIP Auto Update

on:
  schedule:
    - cron: "0 */2 * * *"    # 每2小时增量（UTC）
    - cron: "30 13 * * *"    # 北京 21:30 日报前补充采集
    - cron: "0 14 * * *"     # 北京 22:00 全量核实 + 日报
  workflow_dispatch:
    inputs:
      hours:
        description: "采集时间窗口（小时）"
        required: false
        default: "24"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide window (增量6h / 日报24h / 手动)
        id: win
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "hours=${{ github.event.inputs.hours }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H%M)" = "1400" ] || [ "$(date -u +%H%M)" = "1330" ]; then
            echo "hours=24" >> "$GITHUB_OUTPUT"
          else
            echo "hours=6" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect (RSS / GDELT / ReliefWeb, 公开合规)
        run: python scripts/collect.py --hours ${{ steps.win.outputs.hours }}

      - name: Promote A/B-class events (三级池)
        run: python scripts/promote_events.py --apply

      - name: Generate daily reports (北京24h窗口)
        run: python scripts/generate_reports.py

      - name: Build summary & site
        run: |
          python scripts/build_summary.py
          python scripts/build_site.py

      - name: Commit updated data back to main
        run: |
          git config user.name "ASIP Bot"
          git config user.email "asip@local"
          git add data/*.json reports/ || true
          git commit -m "data: auto-update $(date -u +%Y-%m-%dT%H:%M)Z" || echo "no changes"
          git push || echo "push skipped"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
