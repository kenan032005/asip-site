name: ASIP Production Collection

# Stage 8C Package3 — Production Collection（§五/§十一/§二十六）
# Stage8D fix：schedule 已迁移到 ASIP Production Orchestrator（每小时 due-task 检查，
# production mode 执行）。本 workflow 仅保留 workflow_dispatch 供显式 manual/shadow 使用：
#   execute=true  → 真实采集（production-equivalent）
#   execute=false → shadow 记账 + source health（默认）
# 不再有原生 schedule；不再可能因 schedule 缺省参数进入 shadow。

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "调用真实采集（默认 false = shadow 记账 + source health）"
        required: false
        type: boolean
        default: false

concurrency:
  group: asip-prod-collection
  cancel-in-progress: false

permissions:
  contents: write

env:
  ASIP_MODE: development
  browser_direct_api_call: "false"

jobs:
  collect:
    runs-on: ubuntu-latest
    # C6-R5: collection_run.py 的采集墙钟预算为 2400s（兜底超时 2700s），
    # job 级预算必须高于它，否则手动 `execute=true` 会被 job 超时截断，
    # 拿不到采集器优雅降级后写出的统计。orchestrator job 为 60min，此处对齐为 45min。
    timeout-minutes: 60
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          ref: d33f00eb788522c8c2307c726b55cffce4abbc9f
          fetch-depth: 1

      - name: Checkout production state branch
        uses: actions/checkout@v4
        with:
          ref: production-state
          path: state_src
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Load state（cold start：state 来自 state branch，不依赖本地）
        run: |
          mkdir -p data/runtime/ops
          cp -r state_src/data/runtime/ops/* data/runtime/ops/ 2>/dev/null || true
          ls data/runtime/ops/ 2>/dev/null || echo "(fresh state)"

      - name: Collection run（§五，无 AI）
        env:
          EXECUTE: ${{ github.event.inputs.execute }}
        run: |
          python scripts/ops/collection_run.py $([ "$EXECUTE" = "true" ] && echo "--execute" || true)

      - name: Source health（§十一，非 AI）
        run: python scripts/ops/source_health.py

      - name: Operations telemetry（§二十二）
        run: |
          python - <<'PY'
          import json, pathlib
          import sys; sys.path.insert(0, ".")
          from scripts.ops import operations as ops
          from scripts.ops import production_state as ps
          state = ps.load_state()
          run = ops.new_run("asip-production-collection", "${{ github.run_id }}")
          run["status"] = "completed"
          run["build_status"] = "not_executed"
          run["deploy_status"] = "not_executed"
          prev = json.loads((pathlib.Path("data/runtime/ops/operations_status.json")).read_text(encoding="utf-8"))["runs"] if pathlib.Path("data/runtime/ops/operations_status.json").exists() else []
          ops.save_ops(run, previous=prev[-20:])
          PY

      - name: Commit state → production-state branch
        run: |
          cp -r data/runtime/ops/* state_src/data/runtime/ops/ 2>/dev/null || true
          cd state_src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/runtime/ops
          git commit -m "ops: collection run ${{ github.run_id }}" --allow-empty || echo "no state change"
          # C7-4R：并发写入者（orchestrator/其他运行）会让首次 push 非快进 —— 本地
          # 采集结果必须落盘，故 pull --rebase 后有限重试（3 次），仍失败才报错。
          ok=0
          for i in 1 2 3; do
            git fetch origin production-state || true
            # 冲突时保留本地（本轮采集）数据：-X ours。rebase 在双改大 JSON 时会中止，
            # 因此改用 merge -X ours（C7-4S：实测 rebase 路径报 unmerged files 直接失败）。
            git merge -X ours --no-edit origin/production-state >/dev/null 2>&1 || true
            git add -A 2>/dev/null || true
            git commit --no-edit >/dev/null 2>&1 || true
            if git push origin production-state; then ok=1; break; fi
            echo "push rejected (attempt $i)"
            sleep 5
          done
          if [ "$ok" != "1" ]; then echo "::error::state push failed after 3 attempts"; exit 1; fi
          cd ..

      - name: Upload ops artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-collection
          path: data/runtime/ops/
          if-no-files-found: warn
