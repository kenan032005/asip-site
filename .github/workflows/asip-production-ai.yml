name: ASIP Production AI

# Stage 8C Package3 — Production AI Enrichment（§六/§七/§十六/§十七）
# Stage8D fix：schedule 已迁移到 ASIP Production Orchestrator（每小时 due-task 检查；
# disease 专用 01:30 BJT tick 由 orchestrator 依据 production-state 判定并独立执行）。
# 本 workflow 仅保留 workflow_dispatch 供显式 manual/shadow 使用：
#   run_ai=true  → 真实 AI（production-equivalent）
#   run_ai=false → shadow（--fake --max-items 0）
# 只处理 NEW + eligible + not already enriched（content hash 幂等，§十三）。
# Provider 冻结：deepseek-v4-flash（唯一）；secret 仅 GitHub server-side。

on:
  workflow_dispatch:
    inputs:
      run_ai:
        description: "真实 AI 处理（默认 false = shadow：max-items 0，验证接线）"
        required: false
        type: boolean
        default: false

concurrency:
  group: asip-prod-ai
  cancel-in-progress: false

permissions:
  contents: write

env:
  ASIP_MODE: development
  browser_direct_api_call: "false"
  ASIP_DEEPSEEK_API_KEY: ${{ secrets.ASIP_DEEPSEEK_API_KEY }}

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          ref: 3ece942e2e34887cbb2879d360cd3edc2622b0c6
          fetch-depth: 1

      - name: Checkout production state branch
        uses: actions/checkout@v4
        with:
          ref: production-state
          path: state_src
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Load state（cold start）
        run: |
          mkdir -p data/runtime/ops
          cp -r state_src/data/runtime/ops/* data/runtime/ops/ 2>/dev/null || true

      - name: Runtime confirmation（§二：非敏感信息）
        run: |
          python - <<'PY'
          import os
          ok = bool(os.environ.get("ASIP_DEEPSEEK_API_KEY", "").strip())
          print("credential_available = " + str(ok).lower())
          print("requested_model = deepseek-v4-flash")
          print("browser_direct_api_call = false")
          if not ok:
              raise SystemExit("CREDENTIAL_INJECTION_FAILED")
          PY

      - name: Social enrichment（§六，增量）
        env:
          RUN_AI: ${{ github.event.inputs.run_ai }}
        run: |
          if [ "$RUN_AI" = "true" ]; then
            python scripts/ops/enrichment_run.py --kind social
          else
            python scripts/ops/enrichment_run.py --kind social --fake --max-items 0
          fi

      - name: Disease enrichment（§七，每天一次）
        env:
          RUN_AI: ${{ github.event.inputs.run_ai }}
        run: |
          if [ "$RUN_AI" = "true" ]; then
            python scripts/ops/enrichment_run.py --kind disease
          else
            python scripts/ops/enrichment_run.py --kind disease --fake --max-items 0
          fi

      - name: Timeline build（确定性，无 AI；供前端视图消费）
        run: |
          python scripts/ops/timeline_run.py

      - name: Commit state → production-state branch
        run: |
          cp -r data/runtime/ops/* state_src/data/runtime/ops/ 2>/dev/null || true
          cp -rf data/canonical/. state_src/data/canonical/ 2>/dev/null || true
          cp -rf data/disease/. state_src/data/disease/ 2>/dev/null || true
          cp -rf data/runtime/timeline/. state_src/data/runtime/timeline/ 2>/dev/null || true
          cd state_src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/runtime/ops data/canonical data/disease data/runtime/timeline
          git commit -m "ops: ai run ${{ github.run_id }}" --allow-empty || echo "no state change"
          git push origin production-state
          cd ..

      - name: Upload ops artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-ai
          path: |
            data/runtime/ops/
            data/runtime/ops/enrichment/
          if-no-files-found: warn
