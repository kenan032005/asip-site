name: ASIP Production Orchestrator

# Stage8D schedule fix — Hourly Due-Task Orchestrator（§十五/§十六/§十七）。
#
# 背景（Root Cause，见 docs/stage8d_schedule_root_cause.md）：
#   - 原 multi-cron（collection/AI/reports）实测 10 tick 中 7 MISSED、3 延迟 1h45m–3h
#     → GITHUB_SCHEDULE_DELAY_OR_DROP，GITHUB_SCHEDULE_RELIABILITY_RISK=true。
#   - 原 schedule 路径依赖 github.event.inputs.*（schedule 下为空）→ 全部进入 Shadow。
#
# 本 workflow 是唯一 schedule 执行入口：
#   - 单一每小时 cron（0 * * * *）；
#   - schedule_orchestrator.py 依据 production-state 判断 due 任务并**以 production
#     mode 真实执行**（collection --execute / AI 真实 provider / reports --source
#     canonical / timeline）；
#   - 幂等：processed_hashes + last_successful_* + 报告日期；
#   - trigger=scheduled_orchestrator（自然 Automation）。
#
# workflow_dispatch 仅用于显式 Canary（canary=true → 同 production-equivalent 路径，
# 但 trigger=manual_canary；deploy 以 shadow_only=true 仅做 build/validate/secret scan，
# 不发布 gh-pages）。

# §十六/§十七：GITHUB_NATIVE_SCHEDULE_PRIMARY = REJECTED（实测 24 tick 仅 6 命中、
# max_gap=361min）。保留每小时 cron 作为 **secondary wake-up**；主唤醒改为外部
# 调度器经 repository_dispatch 调用（type=external_scheduler_wakeup），由 workflow
# 校验 trigger_source=external_scheduler 后才认定为 automation。
on:
  workflow_dispatch:
    inputs:
      canary:
        description: "显式 production-equivalent Canary（true=执行 due 任务并标记 manual_canary）"
        required: false
        type: boolean
        default: false
      force_deploy_dispatch:
        description: "Canary 专用：对最近 publishable 报告执行一次 shadow deploy dispatch（验证 actions:write 与 provenance 链，绝不发布 gh-pages）"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [external_scheduler_wakeup]
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: asip-prod-orchestrator
  cancel-in-progress: false

permissions:
  contents: write
  # GITHUB_TOKEN 派发 asip-production-deploy（workflow_dispatch）需要 actions: write；
  # 缺失时 dispatch 返回 403（Canary 实测发现，AUTO_DEPLOY_TRIGGER_HTTP=403）。
  actions: write

env:
  ASIP_MODE: production
  browser_direct_api_call: "false"
  ASIP_DEEPSEEK_API_KEY: ${{ secrets.ASIP_DEEPSEEK_API_KEY }}
  PRODUCTION_SCHEDULE_ENABLED: ${{ vars.PRODUCTION_SCHEDULE_ENABLED }}

jobs:
  orchestrate:
    if: github.event_name != 'schedule' || vars.PRODUCTION_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release code
        uses: actions/checkout@v4
        with:
          ref: 646371702d7d0ef858cfc302848a5d13c278f244
          fetch-depth: 1

      - name: Checkout production state branch
        uses: actions/checkout@v4
        with:
          ref: production-state
          path: state_src
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Load state（cold start）
        run: |
          mkdir -p data/runtime/ops
          cp -r state_src/data/runtime/ops/* data/runtime/ops/ 2>/dev/null || true

      - name: Runtime confirmation（§二：非敏感信息）
        run: |
          python - <<'PY'
          import os
          ok = bool(os.environ.get("ASIP_DEEPSEEK_API_KEY", "").strip())
          print("credential_available = " + str(ok).lower())
          print("requested_model = deepseek-v4-flash")
          print("browser_direct_api_call = false")
          print("schedule_enabled = " + os.environ.get("PRODUCTION_SCHEDULE_ENABLED", "true"))
          PY

      - name: Guard unverified external trigger（§十七 fail-closed）
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.trigger_source != 'external_scheduler'
        run: |
          echo "::error::repository_dispatch 未声明 trigger_source=external_scheduler；不得冒充 automation"
          exit 1

      - name: Run due-task orchestrator（production mode）
        id: orch
        env:
          CANARY: ${{ github.event.inputs.canary }}
          # §三/§十七：触发来源上下文（不含任何凭据）
          ASIP_CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          ASIP_WORKFLOW_INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          FLAGS="--run --json"
          [ "$CANARY" = "true" ] && FLAGS="$FLAGS --canary"
          python scripts/ops/schedule_orchestrator.py $FLAGS > /tmp/orch.json 2> /tmp/orch.err || {
            echo "ORCHESTRATOR_EXIT=$?"; tail -50 /tmp/orch.err; exit 1; }
          cat /tmp/orch.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('/tmp/orch.json'))
          dr = d.get('deploy_request') or {}
          print("deploy_required=" + str(d.get('deploy_required', False)).lower())
          print("deploy_trigger_source=" + str(dr.get('trigger_source') or ''))
          print("deploy_trigger_type=" + str(dr.get('trigger_type') or ''))
          print("deploy_automation=" + str(bool(dr.get('automation'))).lower())
          print("deploy_human=" + str(bool(dr.get('human'))).lower())
          print("deploy_report_date=" + str(dr.get('report_date') or ''))
          print("deploy_report_classification=" + str(dr.get('report_classification') or ''))
          print("deploy_report_id=" + str(dr.get('report_id') or ''))
          print("deploy_root_orchestrator_run_id=" + str(dr.get('root_orchestrator_run_id') or ''))
          PY

      - name: Commit state → production-state branch
        run: |
          cp -r data/runtime/ops/* state_src/data/runtime/ops/ 2>/dev/null || true
          cp -rf data/canonical/. state_src/data/canonical/ 2>/dev/null || true
          cp -rf data/disease/. state_src/data/disease/ 2>/dev/null || true
          cp -rf data/runtime/timeline/. state_src/data/runtime/timeline/ 2>/dev/null || true
          # canonical 变更后再生成的遗留/公开视图一并随 state 提交（V17 一致性 + 站点数据）
          cp -f data/events.json data/pending_events.json data/raw_candidates.json \
            data/quarantine_events.json state_src/data/ 2>/dev/null || true
          cp -rf data/public/. state_src/data/public/ 2>/dev/null || true
          cd state_src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/runtime/ops data/canonical data/disease data/runtime/timeline \
            data/events.json data/pending_events.json data/raw_candidates.json \
            data/quarantine_events.json data/public
          git commit -m "ops: orchestrator run ${{ github.run_id }}" --allow-empty || echo "no state change"
          git push origin production-state
          cd ..

      - name: Auto deploy（publishable report 后自动派发；canary 仅 shadow build/validate）
        if: vars.AUTO_DEPLOY_ENABLED == 'true' && steps.orch.outputs.deploy_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANARY: ${{ github.event.inputs.canary }}
          # §三/§I Deploy Provenance：automation 派发必须携带完整 provenance
          DEPLOY_ROOT_RUN_ID: ${{ steps.orch.outputs.deploy_root_orchestrator_run_id }}
          DEPLOY_ROOT_RUN_URL: ${{ github.server_url }}/kenan032005/asip-site/actions/runs/${{ steps.orch.outputs.deploy_root_orchestrator_run_id }}
          DEPLOY_TRIGGER_SOURCE: ${{ steps.orch.outputs.deploy_trigger_source }}
          DEPLOY_TRIGGER_TYPE: ${{ steps.orch.outputs.deploy_trigger_type }}
          DEPLOY_REPORT_DATE: ${{ steps.orch.outputs.deploy_report_date }}
          DEPLOY_REPORT_CLASS: ${{ steps.orch.outputs.deploy_report_classification }}
          DEPLOY_REPORT_ID: ${{ steps.orch.outputs.deploy_report_id }}
        run: |
          SHADOW="true"
          [ "$CANARY" != "true" ] && SHADOW="false"
          # §J/§I：正式（非 canary）automation 派发的 trigger_source 必须可判定
          if [ "$SHADOW" = "false" ]; then
            case "$DEPLOY_TRIGGER_SOURCE" in
              github_native_schedule|external_scheduler) DEPLOY_AUTO="true";;
              *) echo "::error::automation dispatch 缺少合法 trigger_source=$DEPLOY_TRIGGER_SOURCE"; exit 1;;
            esac
          else
            DEPLOY_AUTO="false"
          fi
          export DEPLOY_AUTO
          python - <<'PY' > /tmp/deploy_payload.json
          import json, os
          payload = {
            "ref": "main",
            "inputs": {
              "shadow_only": os.environ.get("SHADOW", "true"),
              "automation": os.environ.get("DEPLOY_AUTO", "false"),
              "root_orchestrator_run_id": os.environ.get("DEPLOY_ROOT_RUN_ID", ""),
              "root_orchestrator_run_url": os.environ.get("DEPLOY_ROOT_RUN_URL", ""),
              "trigger_source": os.environ.get("DEPLOY_TRIGGER_SOURCE", ""),
              "trigger_type": os.environ.get("DEPLOY_TRIGGER_TYPE", ""),
              "report_date": os.environ.get("DEPLOY_REPORT_DATE", ""),
              "report_classification": os.environ.get("DEPLOY_REPORT_CLASS", ""),
              "report_id": os.environ.get("DEPLOY_REPORT_ID", ""),
            },
          }
          print(json.dumps(payload))
          PY
          echo "DEPLOY_PROVENANCE = $(cat /tmp/deploy_payload.json)"
          HTTP=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kenan032005/asip-site/actions/workflows/asip-production-deploy.yml/dispatches \
            -d @/tmp/deploy_payload.json \
            -o /tmp/deploy_resp.json -w "%{http_code}")
          echo "AUTO_DEPLOY_TRIGGER_HTTP=$HTTP"
          # §M fail-closed：非 2xx 不得静默吞掉，本轮 run 置为失败
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::auto deploy dispatch 失败 HTTP=$HTTP body=$(head -c 300 /tmp/deploy_resp.json)"
            exit 1
          fi

      - name: Canary deploy-dispatch verification（§R：canary 专用，shadow only）
        if: github.event.inputs.canary == 'true' && github.event.inputs.force_deploy_dispatch == 'true' && vars.AUTO_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 读取已提交 state 中最近一次 daily 报告的真实元数据（不得伪造）；
          # dispatch 以 manual_canary（human）provenance 标记，仅验证
          # GITHUB_TOKEN actions:write → HTTP 2xx → deploy run 产生 → inputs 收到。
          python - <<'PY' > /tmp/dep_meta.sh
          import json, glob, os
          base = 'data/runtime/ops/reports'
          rid = rd = cls = ''
          try:
              s = json.load(open(base + '/reports_run_summary.json', encoding='utf-8'))
              cls = ((s.get('results') or {}).get('daily') or {}).get('classification') or ''
          except Exception:
              pass
          for p in sorted(glob.glob(base + '/daily_*.json')):
              try:
                  doc = json.load(open(p, encoding='utf-8'))
              except Exception:
                  continue
              if doc.get('report_date'):
                  rid = doc.get('report_id') or ''
                  rd = doc.get('report_date') or ''
                  break
          print('REPORT_ID=%s' % rid)
          print('REPORT_DATE=%s' % rd)
          print('REPORT_CLASS=%s' % cls)
          print('CANARY_DEPLOY_META report_id=%s report_date=%s classification=%s' % (rid, rd, cls))
          PY
          grep '^CANARY_DEPLOY_META' /tmp/dep_meta.sh || true
          source <(grep -E '^(REPORT_ID|REPORT_DATE|REPORT_CLASS)=' /tmp/dep_meta.sh)
          if [ -z "$REPORT_ID" ]; then echo "::error::无可用 daily 报告元数据，拒绝伪造 dispatch"; exit 1; fi
          HTTP=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kenan032005/asip-site/actions/workflows/asip-production-deploy.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"shadow_only\":\"true\",\"automation\":\"false\",\"root_orchestrator_run_id\":\"${{ github.run_id }}\",\"root_orchestrator_run_url\":\"${{ github.server_url }}/kenan032005/asip-site/actions/runs/${{ github.run_id }}\",\"trigger_source\":\"manual_canary\",\"trigger_type\":\"human\",\"report_date\":\"$REPORT_DATE\",\"report_classification\":\"$REPORT_CLASS\",\"report_id\":\"$REPORT_ID\"}}" \
            -o /tmp/deploy_resp.json -w "%{http_code}")
          echo "AUTO_DEPLOY_DISPATCH_HTTP=$HTTP"
          echo "AUTO_DEPLOY_CANARY_PROVENANCE = trigger_source=manual_canary report_id=$REPORT_ID report_date=$REPORT_DATE classification=$REPORT_CLASS"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "::error::canary deploy dispatch 失败 HTTP=$HTTP body=$(head -c 300 /tmp/deploy_resp.json)"
            exit 1
          fi

      - name: Upload ops artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-orchestrator
          path: |
            data/runtime/ops/
            data/runtime/ops/enrichment/
          if-no-files-found: warn
