name: ASIP V1.1 C3 — Real AI Materialization (server-side, non-production)

# C3R2 §二/§三/§四：真实 DeepSeek 只在 GitHub Actions runner 内运行，
# 并通过**受限 commit-back** 把结果物化回 v11-resume-after-v1.0。
#
# 触发方式：
#   * workflow_dispatch        —— 人工手动触发（推荐）
#   * push tag c3r2-real-ai-*  —— 一次性可审计触发（不需要 API token）
#
# 硬性边界：
#   * 只作用于 v11-resume-after-v1.0；不 push main / gh-pages / production-state，
#     不 dispatch Production orchestrator，不移动 V1.0 tag / release；
#   * permissions 仅 contents: write（仅用于受限 commit-back）；
#   * commit-back 走**白名单 + staged 路径守卫**，任何白名单外路径立即失败。

on:
  workflow_dispatch:
    inputs:
      window_start:
        description: "14 日窗口开始（YYYY-MM-DD，北京时间自然日）"
        required: false
        default: "2026-09-05"
      window_end:
        description: "14 日窗口结束（YYYY-MM-DD）"
        required: false
        default: "2026-09-18"
      mode:
        description: "full | summary_only | c3f_incremental（C3F-R 用 c3f_incremental）"
        required: false
        default: "c3f_incremental"
      batch_size:
        description: "每次调用处理的新闻条数（8-12）"
        required: false
        default: "10"
      force_home:
        description: "强制刷新 Homepage analysis"
        required: false
        default: "false"
  push:
    tags:
      # 只有这两个具名前缀能触发真实 AI；**不得**放宽成 "*"
      - "c3r2-real-ai-*"
      - "c3f-real-ai-*"

permissions:
  contents: write

concurrency:
  group: asip-v11-c3-ai
  cancel-in-progress: false

env:
  TARGET_BRANCH: v11-resume-after-v1.0
  ASIP_DEEPSEEK_BASE_URL: https://api.deepseek.com

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Guard — this workflow may only ever touch v11-resume-after-v1.0
        run: |
          set -euo pipefail
          echo "trigger ref = ${GITHUB_REF}"
          if [[ "${GITHUB_REF}" == refs/heads/* && "${GITHUB_REF}" != "refs/heads/${TARGET_BRANCH}" ]]; then
            echo "REFUSED: branch ${GITHUB_REF} is not ${TARGET_BRANCH}"
            exit 1
          fi
          # 具名一次性触发前缀（必须与 on.push.tags 的列表保持一致）
          case "${GITHUB_REF}" in
            refs/tags/c3r2-real-ai-*|refs/tags/c3f-real-ai-*) ;;
            refs/tags/*)
              echo "REFUSED: tag ${GITHUB_REF} is not a registered one-shot trigger"
              exit 1 ;;
          esac
          echo "GUARD = PASS"

      - name: Checkout v11-resume-after-v1.0
        uses: actions/checkout@v4
        with:
          ref: v11-resume-after-v1.0
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve AI mode (tag trigger has no inputs)
        id: mode
        run: |
          set -euo pipefail
          # tag push 事件里 inputs 为空；必须显式落到 c3f_incremental，
          # 绝不能因为 inputs.mode 缺失而回退成 full（那会重跑全部 localization/event/country）。
          RAW="${{ github.event.inputs.mode }}"
          MODE="${RAW:-c3f_incremental}"
          echo "C3F_MODE=$MODE" >> "$GITHUB_ENV"
          echo "RESOLVED_AI_MODE = $MODE"
          case "$MODE" in
            full|summary_only|c3f_incremental) ;;
            *) echo "UNKNOWN_MODE=$MODE"; exit 1 ;;
          esac
          # tag 触发 = 增量场景：拒绝 full
          if [ "${GITHUB_REF}" != "refs/heads/${TARGET_BRANCH}" ] && [ "$MODE" = "full" ]; then
            echo "FULL_MODE_REFUSED_FOR_TAG_TRIGGER"; exit 1
          fi

      - name: Secret presence check (name only)
        env:
          ASIP_DEEPSEEK_API_KEY: ${{ secrets.ASIP_DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${ASIP_DEEPSEEK_API_KEY:-}" ]; then
            echo "ASIP_DEEPSEEK_API_KEY = MISSING"
            echo "USER_ACTION_REQUIRED = ADD_REPOSITORY_SECRET_ASIP_DEEPSEEK_API_KEY"
            exit 1
          fi
          echo "ASIP_DEEPSEEK_API_KEY = PRESENT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Input audit — mode-aware (prior real AI state is not contamination)
        run: |
          set -euo pipefail
          # C3F：审计语义随 C3F_MODE 变化。
          #  - full            ：严格政策，不得带任何既有 AI 产物
          #  - c3f_incremental ：允许经过验证的历史真实 AI 产物作为 prior state，
          #                      但 stub / simulation / unknown provenance 依旧 fail closed
          python -m scripts.ops.c3_input_audit --root . --mode "$C3F_MODE"

      - name: DeepSeek qualification (minimal, no secret output)
        env:
          ASIP_DEEPSEEK_API_KEY: ${{ secrets.ASIP_DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/ai/qualification/c3_qualify.py --require-pass

      - name: Real run 1 — localization + event/country/homepage intelligence
        env:
          ASIP_DEEPSEEK_API_KEY: ${{ secrets.ASIP_DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python -m scripts.ops.c3_run \
            --root . \
            --provider auto \
            --window-start "${{ inputs.window_start || '2026-09-05' }}" \
            --window-end "${{ inputs.window_end || '2026-09-18' }}" \
            --batch-size "${{ inputs.batch_size || '10' }}" \
            --mode "$C3F_MODE" \
            $( [ "${{ inputs.force_home }}" = "true" ] && echo --force-home ) \
            --out run1.json
          cp run1.json c3_run_report_run1.json

      - name: Real run 2 — identical input must make zero AI calls (§二十)
        env:
          ASIP_DEEPSEEK_API_KEY: ${{ secrets.ASIP_DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python -m scripts.ops.c3_run --root . --provider auto \
            --window-start "${{ inputs.window_start || '2026-09-05' }}" \
            --window-end "${{ inputs.window_end || '2026-09-18' }}" \
            --batch-size "${{ inputs.batch_size || '10' }}" \
            --mode "$C3F_MODE" \
            --out run2.json
          cp run2.json c3_run_report_run2.json
          python - <<'PY'
          import json
          r2 = json.load(open("run2.json", encoding="utf-8"))
          print("SECOND_IDENTICAL_RUN_AI_CALLS =", r2.get("ai_calls_total"))
          assert r2.get("ai_calls_total") == 0, "idempotency violated: run 2 made AI calls"
          print("IDEMPOTENCY = PASS")
          PY

      - name: Build public AI view
        run: |
          set -euo pipefail
          python -m scripts.ops.build_ai_views --root .

      - name: Scoped commit-back (whitelist + guard)
        id: commit
        if: always()
        run: |
          set -euo pipefail
          # 无论成功与否都写一条**最小**运行状态记录（属于 AI artifact 层，不含 secret /
          # 不含 raw model response / 不含 prompt 正文），便于事后在分支上核对运行结果。
          python - <<'PY'
          import json, os, time
          d = os.path.join("data", "intelligence", "ai", "runs")
          os.makedirs(d, exist_ok=True)
          def rd(p):
              try: return json.load(open(p, encoding="utf-8"))
              except Exception: return {}
          r1, r2 = rd("c3_run_report_run1.json"), rd("c3_run_report_run2.json")
          rec = {
              "schema_version": "c3-ci-status-v1",
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "job_status": os.environ.get("JOB_STATUS", "unknown"),
              "run1_present": bool(r1), "run2_present": bool(r2),
              "run1": {k: r1.get(k) for k in (
                  "status", "model", "data_as_of", "ai_calls_total",
                  "ai_calls_localization", "ai_calls_event", "ai_calls_country",
                  "ai_calls_homepage", "cache_hits", "cache_misses",
                  "news_per_localization_call", "localization", "event",
                  "country", "homepage", "gates")},
              "run2_ai_calls_total": r2.get("ai_calls_total"),
          }
          with open(os.path.join(d, "ci_status.json"), "w", encoding="utf-8") as f:
              json.dump(rec, f, ensure_ascii=False, indent=1)
          print("ci_status written")
          PY
          git config user.name  "asip-c3-bot"
          git config user.email "asip-c3-bot@users.noreply.github.com"
          WHITELIST=(
            "data/intelligence/ai/localization/"
            "data/intelligence/ai/event_analysis/"
            "data/intelligence/ai/country_analysis/"
            "data/intelligence/ai/homepage_analysis/"
            "data/intelligence/ai/runs/"
            "data/views/ai_intelligence.json"
            "data/canonical/articles.json"
            "data/views/news_stream.json"
          )
          for p in "${WHITELIST[@]}"; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          # 守卫：Unicode-safe 白名单判定。
          # C3R2 教训：`git diff --cached --name-only` 会对非 ASCII 路径做 quoted/octal 转义
          # （如 country_analysis/\344\270\255\346\226\207.json），导致合法中文路径被判越界。
          # 因此改为**NUL 分隔的原始路径**判定（见 scripts/ops/c3_commit_guard.py）。
          # core.quotePath=false 仅作辅助（便于日志可读），不参与判定。
          git config core.quotePath false || true
          if ! python -m scripts.ops.c3_commit_guard --root . ; then
            git reset -q
            echo "COMMIT_BACK = REFUSED"
            exit 1
          fi
          git diff --cached --name-only -z > staged_paths.txt
          python - <<'PYEOF'
          import subprocess, sys
          r = subprocess.run(["git", "diff", "--cached", "--name-only", "-z", "--no-renames"],
                               capture_output=True)
          paths = [p for p in r.stdout.decode("utf-8", "surrogateescape").split("\0") if p]
          prod = [p for p in paths
                  if p.startswith(("data/runtime/ops/", "data/audit/", "data/public/"))]
          print("STAGED_FILES = %d" % len(paths))
          print("PRODUCTION_WRITE_PATHS = %d" % len(prod))
          if prod:
              print("PRODUCTION_WRITE_DETECTED")
              sys.exit(1)
          PYEOF
          if [ -s staged_paths.txt ]; then
            git commit -q -m "data(v1.1): materialize DeepSeek localization and intelligence"
            echo "AI_DATA_COMMIT = $(git rev-parse --short HEAD)"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "AI_DATA_COMMIT = NONE (no changes)"
            rm -f staged_paths.txt
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Push commit-back to v11-resume-after-v1.0 only
        if: steps.commit.outputs.commit_sha != ''
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "AI_DATA_PUSH_STATUS = PASS"
          echo "REMOTE_HEAD = $(git ls-remote origin refs/heads/${TARGET_BRANCH} | cut -f1)"

      - name: Report real metrics
        if: always()
        run: |
          python - <<'PY'
          import json, os
          def rd(p):
              try: return json.load(open(p, encoding="utf-8"))
              except Exception: return {}
          r1, r2 = rd("c3_run_report_run1.json"), rd("c3_run_report_run2.json")
          for tag, d in (("RUN1", r1), ("RUN2", r2)):
              if not d:
                  print(tag, "= missing"); continue
              print("--- %s ---" % tag)
              for k in ("status", "model", "data_as_of", "ai_calls_total",
                        "ai_calls_localization", "ai_calls_event", "ai_calls_country",
                        "ai_calls_homepage", "cache_hits", "cache_misses",
                        "news_per_localization_call"):
                  print("  %-28s = %s" % (k, d.get(k)))
              print("  localization =", json.dumps(d.get("localization"), ensure_ascii=False))
              print("  event        =", json.dumps(d.get("event"), ensure_ascii=False))
              print("  country      =", json.dumps(d.get("country"), ensure_ascii=False))
              print("  homepage     =", json.dumps(d.get("homepage"), ensure_ascii=False))
              print("  gates        =", json.dumps(d.get("gates"), ensure_ascii=False))
          PY

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asip-v11-c3r2-real-ai
          path: |
            c3_run_report_run1.json
            c3_run_report_run2.json
            data/intelligence/ai/**
            data/views/ai_intelligence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Non-production guarantee
        if: always()
        run: |
          echo "PRODUCTION_CHANGED = false"
          echo "  no gh-pages deploy / no production-state write / no orchestrator dispatch / no V1.0 tag move"
